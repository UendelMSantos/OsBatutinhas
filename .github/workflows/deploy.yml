name: Deploy Landing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPSHOST }}
          username: root
          key: ${{ secrets.SSKEY }}
          script: |
            cd /apps/landing
            git pull origin main
            docker compose down
            docker compose up -d --build
